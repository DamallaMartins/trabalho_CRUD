<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">🎓 Área do Aluno</span>
        </div>
    </nav>

    <main class="container pb-5" style="max-width: 600px;">

        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h1 class="h5 mb-0">{{ titulo }}</h1>
            </div>
            <div class="card-body">

                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Nome</label>
                        <!--
                            name="nome" → deve ser igual ao que usamos em request.POST['nome'] na view
                            value="..." → se for edição, o campo já vem preenchido com o valor atual
                        -->
                        <input type="text" name="nome" class="form-control"
                               value="{{ aluno.nome|default:'' }}"
                               placeholder="Nome completo" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Curso</label>
                        <input type="text" name="curso" class="form-control"
                               value="{{ aluno.curso|default:'' }}"
                               placeholder="Nome do curso" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Bio</label>
                        <textarea name="bio" class="form-control" rows="3"
                                  placeholder="Escreva uma breve bio...">{{ aluno.bio|default:'' }}</textarea>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">💾 Salvar</button>
                        <a href="{% url 'aluno' %}" class="btn btn-secondary">← Voltar</a>
                    </div>
                </form>

            </div>
        </div>

    </main>

</body>
</html>
