{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo }}</title>
    <link rel="stylesheet" href="{% static 'filme/css/style.css' %}">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">Área do Filme</span>
        </div>
    </nav>

    <main class="container pb-5" style="max-width: 600px;">

        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h1 class="h5 mb-0">{{ titulo }}</h1>
            </div>
            <div class="card-body">

                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Nome</label>
                        <!--
                            name="nome" → deve ser igual ao que usamos em request.POST['nome'] na view
                            value="..." → se for edição, o campo já vem preenchido com o valor atual
                        -->
                        <input type="text" name="nome" class="form-control"
                               value="{{ filme.nome|default:'' }}"
                               placeholder="Nome completo" required>
                    </div>

                    <div class="mb-3">
                                <label class="form-label fw-semibold">País de Origem</label>
                                <input type="text" name="pais_origem" class="form-control"
                               value="{{ filme.pais_origem|default:'' }}"
                               placeholder="País de origem do filme" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Diretor</label>
                        <input type="text" name="diretor" class="form-control"
                               value="{{ filme.diretor|default:'' }}"
                               placeholder="Nome do diretor" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Gênero</label>
                        <input type="text" name="genero" class="form-control"
                               value="{{ filme.genero|default:'' }}"
                               placeholder="Ex.: drama, comédia" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Review</label>
                        <textarea name="review" class="form-control" rows="3"
                                  placeholder="Escreva uma breve review...">{{ filme.review|default:'' }}</textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Nota</label>
                        <input type="number" name="nota" class="form-control"
                               value="{{ filme.nota|default:'' }}" min="1" max="5">
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Dia em que foi assistido</label>
                        <input type="date" name="data_assistido" class="form-control"
                               value="{{ filme.data_assistido|date:'Y-m-d' }}">
                    </div>

                    <div class="form-check mb-3">
                        <input type="checkbox" name="assistido" class="form-check-input" id="assistido"
                               {% if filme.assistido %}checked{% endif %}>
                        <label class="form-check-label" for="assistido">Filme assistido</label>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Salvar</button>
                        <a href="{% url 'filme' %}" class="btn btn-secondary">← Voltar</a>
                    </div>
                </form>

            </div>
        </div>

    </main>

</body>
</html>
