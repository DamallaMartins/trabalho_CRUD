{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excluir Filme</title>
    <link rel="stylesheet" href="{% static 'filme/css/style.css' %}">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">Área do Filme</span>
        </div>
    </nav>

    <main class="container pb-5" style="max-width: 500px;">
        <div class="card border-danger shadow-sm">
            <div class="card-header bg-danger text-white">
                <h1 class="h5 mb-0">Confirmar Exclusão</h1>
            </div>
            <div class="card-body">
                <p class="mb-1">Você tem certeza que deseja excluir o filme:</p>
                <p class="fw-bold fs-5 text-dark">{{ filme.nome }}</p>
                <p class="text-muted small mb-2">Diretor: {{ filme.diretor }}</p>
                <p class="text-danger small mb-3">Esta ação não pode ser desfeita!</p>

                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-danger">Sim, excluir</button>
                        <a href="{% url 'filme' %}" class="btn btn-secondary">← Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </main>

</body>
</html>
