{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diretores</title>
    <link rel="stylesheet" href="{% static 'filme/css/style.css' %}">
</head>
<body>
    <main class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3 mb-0">Diretores</h1>
            <a href="{% url 'filme' %}" class="btn btn-primary">Ver filmes</a>
        </div>

        {% if diretores %}
        <div class="card shadow-sm">
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>Diretor</th>
                            <th>Filmes cadastrados</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for diretor in diretores %}
                        <tr>
                            <td class="fw-semibold">{{ diretor.diretor }}</td>
                            <td>{{ diretor.filmes_count }}</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
        {% else %}
        <div class="alert alert-info">Nenhum diretor cadastrado.</div>
        {% endif %}
    </main>
</body>
</html>
